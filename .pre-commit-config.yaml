repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --no-sync ruff check --fix
        language: system
        types: [python]
        stages: [pre-commit]

      - id: ruff-format
        name: ruff format
        entry: uv run --no-sync ruff format --force-exclude
        language: system
        types: [python]
        stages: [pre-commit]
        
      - id: unittest
        name: unittest
        entry: uv run --no-sync python -m unittest discover -s tests -v
        language: system
        pass_filenames: false
        stages: [pre-commit]
