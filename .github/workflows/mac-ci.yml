name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: '3.12'

      - name: Install build dependencies
        run: uv sync --all-groups --no-install-project

      - name: Build native library with Meson
        run: |
          uv run meson setup build
          uv run meson compile -C build

      - name: Run unittests
        run: uv run --frozen python -m unittest discover -s tests
